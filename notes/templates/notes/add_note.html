{% extends 'notes/base.html' %}
{% block title %}
    {% if form.instance.pk %}Edit{% else %}Add{% endif %} Note
{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    {% if form.instance.pk %}Edit Note{% else %}Add New Note{% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">
                        {% if form.instance.pk %}Update{% else %}Save{% endif %}
                    </button>
                </form>
                <a href="{% url 'home' %}" class="btn btn-link mt-3">Back to notes</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
