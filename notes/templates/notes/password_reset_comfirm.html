{% extends 'notes/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body">
                <h4>Set new password</h4>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Change 
Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
